<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="42">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="r" x="-5%" y="-30%" width="110%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.05" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="20" xChannelSelector="R" yChannelSelector="G" result="d0"/>
      <feComponentTransfer in="d0" result="d">
        <feFuncA type="linear" slope="13" intercept="-4.4"/>
      </feComponentTransfer>
      <feOffset in="d" dy="3.4" result="dn"/>
      <feComposite in="dn" in2="d" operator="out" result="band"/>
      <feGaussianBlur in="band" stdDeviation="1.7" result="soft"/>
      <feFlood flood-color="#000000" flood-opacity=".5" result="ink"/>
      <feComposite in="ink" in2="soft" operator="in"/>
    </filter>
  </defs>
  <rect x="-24" width="1490" height="42" fill="url(#g)" filter="url(#r)"/>
</svg>
